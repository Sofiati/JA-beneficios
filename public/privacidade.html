<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Política de Privacidade — JÁ Benefícios</title>
    <!-- Stub de compatibilidade: a política agora vive em /privacidade (gerada no
         build por scripts/gerar-rota-privacidade.mjs). No Netlify há um 301
         (/privacidade.html → /privacidade); este arquivo cobre links antigos de
         terceiros em qualquer outra hospedagem estática.
         Sem CSS próprio de propósito: o redirecionamento é imediato e o design
         system não está disponível fora do bundle do Vite. -->
    <link rel="canonical" href="https://jadigital.com.br/privacidade" />
    <meta name="robots" content="noindex, follow" />
    <meta http-equiv="refresh" content="0; url=/privacidade" />
    <script>
      window.location.replace("/privacidade");
    </script>
  </head>
  <body>
    <h1>Política de Privacidade</h1>
    <p>
      Esta página mudou de endereço. Se o redirecionamento não acontecer
      automaticamente,
      <a href="/privacidade">abra a política de privacidade</a>.
    </p>
  </body>
</html>
