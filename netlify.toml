[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Fallback SPA para o index.html (garante suporte a rotas e recargas no Netlify)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo para assets com hash no nome; HTML sempre revalidado.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
